services:
  core:
    build: ./core
    container_name: streamvault_core
    user: root
    restart: unless-stopped
    init: true
    cpu_shares: 1024
    cpus: ${CORE_CPUS:-0.0}
    mem_limit: ${CORE_MEMORY_LIMIT:-0}
    pids_limit: ${CORE_PIDS_LIMIT:-384}
    ulimits:
      nofile: ${CORE_NOFILE_LIMIT:-16384}
    stop_grace_period: 30s
    # Explicit resolvers — the host's resolver was leaking into the
    # container and failing for external DNS (api.themoviedb.org etc.).
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "8000:8000"
    volumes:
      - ${UPDATE_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - ..:/workspace
      - ${HOST_DATA_ROOT:-./data}:/saas-data
      - ./core/templates:/app/templates
      - ./core:/app
      - ./assets:/app/assets
    environment:
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in vault/.env before starting StreamVault}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - REMEMBER_SESSION_DAYS=${REMEMBER_SESSION_DAYS:-30}
      - DOMAIN=${DOMAIN:-localhost}
      - CHECK_INTERVAL_MINUTES=${CHECK_INTERVAL_MINUTES:-30}
      - HOST_DATA_ROOT=${HOST_DATA_ROOT:-/opt/saas-data}
      - UPDATE_WORKSPACE=/workspace
      - UPDATE_REMOTE=${UPDATE_REMOTE:-}
      - UPDATE_BRANCH=${UPDATE_BRANCH:-}
      - UPDATE_MODE=${UPDATE_MODE:-branch}
      - UPDATE_PROVIDER=${UPDATE_PROVIDER:-auto}
      - UPDATE_API_URL=${UPDATE_API_URL:-}
      - UPDATE_REPOSITORY=${UPDATE_REPOSITORY:-}
      - UPDATE_CHECK_INTERVAL_HOURS=${UPDATE_CHECK_INTERVAL_HOURS:-24}
      - CONCURRENT_DOWNLOADS=${CONCURRENT_DOWNLOADS:-1}
      - DOWNLOAD_RATE_LIMIT=${DOWNLOAD_RATE_LIMIT:-4194304}
      - TORRENT_UPLOAD_RATE_LIMIT=${TORRENT_UPLOAD_RATE_LIMIT:-65536}
      - TORRENT_MAX_PEERS=${TORRENT_MAX_PEERS:-40}
      - YTDLP_CONCURRENT_FRAGMENTS=${YTDLP_CONCURRENT_FRAGMENTS:-5}
      - MAX_LIVE_REMUXES=${MAX_LIVE_REMUXES:-2}
      - VIDEO_ENCODER=${VIDEO_ENCODER:-software}
      - VIDEO_RENDER_DEVICE=${VIDEO_RENDER_DEVICE:-/dev/dri/renderD128}
      - MAX_CACHE_SIZE_GB=${MAX_CACHE_SIZE_GB:-100}
      - STORAGE_PROFILE=${STORAGE_PROFILE:-balanced}
      - ABANDONED_DOWNLOAD_TTL_HOURS=${ABANDONED_DOWNLOAD_TTL_HOURS:-1}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-0}
      - AUTO_CACHE_ON_WATCH=${AUTO_CACHE_ON_WATCH:-true}
      - MIN_FREE_DISK_GB=${MIN_FREE_DISK_GB:-2}
      - PLAYBACK_CACHE_RETENTION_HOURS=${PLAYBACK_CACHE_RETENTION_HOURS:-168}
      - MEDIA_ACCEL_REDIRECT=${MEDIA_ACCEL_REDIRECT:-true}
      - CLOUDFLARED_EXTERNAL=true
      - CLOUDFLARED_URL=http://cloudflared:8080
      - DOWNLOADER_URL=http://downloader:8001
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-["*"]}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - TMDB_TOKEN=${TMDB_TOKEN}
      - OPENSUBTITLES_API_KEY=${OPENSUBTITLES_API_KEY}
      - OPENSUBTITLES_USER_AGENT=${OPENSUBTITLES_USER_AGENT:-StreamVaultDebug/1.0}
    depends_on:
      - downloader
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 3 -H \"Host: $${DOMAIN:-localhost}\" http://127.0.0.1:8000/api/ready"]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  downloader:
    build:
      context: ./core
      dockerfile: Dockerfile.downloader
    container_name: streamvault_downloader
    restart: unless-stopped
    init: true
    # Leave host resources for playback and the tunnel under download load.
    cpu_shares: 256
    cpus: ${DOWNLOADER_CPUS:-1.0}
    mem_limit: ${DOWNLOADER_MEMORY_LIMIT:-768m}
    pids_limit: ${DOWNLOADER_PIDS_LIMIT:-128}
    ulimits:
      nofile: ${DOWNLOADER_NOFILE_LIMIT:-8192}
    stop_grace_period: 30s
    security_opt: ["no-new-privileges:true"]
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - ${HOST_DATA_ROOT:-./data}:/saas-data
      - ./core:/app
    environment:
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in vault/.env before starting StreamVault}
      - CONCURRENT_DOWNLOADS=${CONCURRENT_DOWNLOADS:-1}
      - DOWNLOAD_RATE_LIMIT=${DOWNLOAD_RATE_LIMIT:-4194304}
      - TORRENT_UPLOAD_RATE_LIMIT=${TORRENT_UPLOAD_RATE_LIMIT:-65536}
      - TORRENT_MAX_PEERS=${TORRENT_MAX_PEERS:-40}
      - YTDLP_CONCURRENT_FRAGMENTS=${YTDLP_CONCURRENT_FRAGMENTS:-5}
      - MIN_FREE_DISK_GB=${MIN_FREE_DISK_GB:-2}
      - DATA_ROOT=/saas-data
      - STORAGE_PROFILE=${STORAGE_PROFILE:-balanced}
      - MAX_CACHE_SIZE_GB=${MAX_CACHE_SIZE_GB:-100}
      - DOWNLOADS_ROOT=/saas-data/downloads
      - OPENSUBTITLES_API_KEY=${OPENSUBTITLES_API_KEY}
      - OPENSUBTITLES_USER_AGENT=${OPENSUBTITLES_USER_AGENT:-StreamVaultDebug/1.0}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/ready"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cloudflared:
    build:
      context: ./core
      dockerfile: Dockerfile.tunnel
    container_name: streamvault_cloudflared
    restart: unless-stopped
    init: true
    cpu_shares: 1024
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - ${HOST_DATA_ROOT:-./data}/config:/saas-data/config
    environment:
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in vault/.env before starting StreamVault}
      - TUNNEL_API_PORT=8080
      - TUNNEL_PROTOCOL=${TUNNEL_PROTOCOL:-http2}
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
      - TUNNEL_HOSTNAME=${TUNNEL_HOSTNAME:-}
      - TUNNEL_ORIGIN=${TUNNEL_ORIGIN:-http://nginx:80}
      - TUNNEL_MODE=${TUNNEL_MODE:-}
      - TUNNEL_ENABLED=${TUNNEL_ENABLED:-}
    tmpfs:
      - /tmp
    mem_limit: ${TUNNEL_MEMORY_LIMIT:-512m}
    pids_limit: 64
    security_opt: ["no-new-privileges:true"]
    depends_on:
      nginx:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "services.cloudflared_worker", "--healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:stable@sha256:755983e0e0e568e4c86297cc91485d7a6f9fb73e42d8a19cdba3eac9e8b8cfc9
    container_name: streamvault_nginx
    restart: unless-stopped
    cpu_shares: 1024
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./assets:/app/assets:ro
      - ${HOST_DATA_ROOT:-./data}/downloads:/srv/downloads:ro
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/80; printf 'GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; read -r response <&3; [[ $$response == 'HTTP/1.1 204'* ]]"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
