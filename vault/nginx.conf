events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    # Container recreation can change core's IP while nginx remains running.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Cloudflare terminates TLS before forwarding to this HTTP listener.
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        https   https;
        http    http;
    }

    server {
        listen 80;
        set $core_backend http://core:8000;
        # Preserve the browser's origin for both nginx and backend redirects.
        absolute_redirect off;
        proxy_redirect http://$host/ /;
        
        # Servir assets directamente desde el disco
        location /assets/ {
            alias /app/assets/;
            expires -1;
            add_header Cache-Control "no-cache, must-revalidate";
            # Compress text assets here; media and event streams stay unbuffered.
            gzip on;
            gzip_vary on;
            gzip_min_length 1024;
            gzip_comp_level 5;
            gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
        }

        # Audio-compatible local playback. Serves either a cached faststart
        # MP4 (with Range support) or a long-lived fragmented MP4 stream.
        # No trailing slash: nginx would redirect /files to /files/, while
        # FastAPI redirects it back. Behind a tunnel that also downgrades HTTPS.
        location /api/downloads/files {
            proxy_pass $core_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_buffering off;
            proxy_read_timeout 6h;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Both publisher and consumer federation paths carry large media.
        # Never spool relayed movies to nginx temporary files or compress them.
        location /api/federation/ {
            proxy_pass $core_backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_buffering off;
            proxy_max_temp_file_size 0;
            gzip off;
            proxy_read_timeout 6h;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location = /api/local/proxy-stream {
            proxy_pass $core_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Proxy para el backend de FastAPI
        location / {
            proxy_pass $core_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 15s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        }
    }
}
