name: Build and test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Scan public history for secrets with a checksum-pinned scanner
        run: |
          curl --fail --location --retry 3 --max-time 60 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts=HEAD --timeout 120

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: vault/core/requirements-test.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install locked Python dependencies and browser
        run: |
          python -m pip install --require-hashes -r vault/core/requirements-test.lock
          python -m playwright install --with-deps chromium
      - name: Install deterministic media and proxy test fixtures
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg aria2 nginx
          curl --fail --retry 3 --max-time 60 \
            https://cdn.jsdelivr.net/npm/hls.js@1.6.16/dist/hls.min.js \
            --output "$RUNNER_TEMP/streamvault-hls.min.js"
          printf '%s  %s\n' \
            442f599c34f103c3355b375a23bdff560592d7117d09a8c847242ea3de2d40e0 \
            "$RUNNER_TEMP/streamvault-hls.min.js" | sha256sum --check -
          echo "STREAMVAULT_HLS_JS=$RUNNER_TEMP/streamvault-hls.min.js" >> "$GITHUB_ENV"
      - name: Validate version, source and regressions
        run: |
          python vault/scripts/release.py check
          python vault/scripts/check.py validate
          python -m pytest --browser -q
      - name: Build production images without starting services
        env:
          # Only Compose parsing/building uses this public, non-production value.
          SECRET_KEY: streamvault-build-check-only-secret
        run: |
          docker compose --env-file vault/.env.example -f vault/docker-compose.yaml config --quiet
          docker compose --env-file vault/.env.example -f vault/docker-compose.yaml build core downloader cloudflared

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install the locked frontend compiler
        run: python -m pip install --require-hashes -r android/requirements.lock
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '11076708'
          # The default requests the removed legacy "tools" package. Install
          # only the explicitly pinned platform/build tools in the next step.
          packages: ''
      - name: Install the pinned Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Test, lint and build both APK variants
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug lintRelease assembleRelease
      - name: Check APK contents before uploading build artifacts
        run: |
          python3 vault/scripts/release.py check --apk android/app/build/outputs/apk/debug/app-debug.apk
          python3 vault/scripts/release.py check --apk android/app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-builds
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-reports
          path: android/app/build/reports/
