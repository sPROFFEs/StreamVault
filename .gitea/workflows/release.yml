name: Validate and prepare Gitea draft release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable version tag
        required: true
        type: string

jobs:
  web-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag || gitea.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: https://github.com/actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate release tag and distribution branch
        env:
          RELEASE_TAG: ${{ inputs.tag || gitea.ref_name }}
          RELEASE_BRANCH: ${{ vars.STREAMVAULT_RELEASE_BRANCH }}
        run: |
          python vault/scripts/release.py check --tag "$RELEASE_TAG"
          test -n "$RELEASE_BRANCH"
          git check-ref-format "refs/heads/$RELEASE_BRANCH"
          git merge-base --is-ancestor HEAD "refs/remotes/origin/$RELEASE_BRANCH"
      - name: Install locked dependencies and Chromium
        run: |
          python -m pip install --require-hashes -r vault/core/requirements-test.lock
          python -m playwright install --with-deps chromium
      - name: Validate and run regression suite
        run: |
          python vault/scripts/check.py validate
          python -m pytest --browser -q
      - name: Package the committed web release
        env:
          RELEASE_TAG: ${{ inputs.tag || gitea.ref_name }}
          RELEASE_BRANCH: ${{ vars.STREAMVAULT_RELEASE_BRANCH }}
          RELEASE_REPOSITORY: ${{ gitea.repository }}
        run: |
          python vault/scripts/release.py package --tag "$RELEASE_TAG" --repository "$RELEASE_REPOSITORY" --branch "$RELEASE_BRANCH"
          cd dist
          sha256sum --check SHA256SUMS
      - name: Create draft and attach verified assets (never auto-publish)
        env:
          GITEA_RELEASE_TOKEN: ${{ secrets.STREAMVAULT_RELEASE_TOKEN }}
          RELEASE_SERVER: ${{ gitea.server_url }}
          RELEASE_REPOSITORY: ${{ gitea.repository }}
        run: python vault/scripts/publish_gitea_release.py --server "$RELEASE_SERVER" --repository "$RELEASE_REPOSITORY" --assets dist
